    meta.crossplane.io/readme: |
      # provider-openfga

      Crossplane provider for [OpenFGA](https://openfga.dev/): manage authorization
      stores, authorization models and relationship tuples as Kubernetes resources.

      Generated with [Upjet](https://github.com/crossplane/upjet) from
      [`openfga/terraform-provider-openfga`](https://github.com/openfga/terraform-provider-openfga)
      v0.5.1. Requires **Crossplane v2**. Source, issues and full documentation:
      https://github.com/l-nmch/provider-openfga

      ## Install

      ```yaml
      apiVersion: pkg.crossplane.io/v1
      kind: Provider
      metadata:
        name: provider-openfga
      spec:
        package: xpkg.upbound.io/l-nmch/provider-openfga:v0.1.0
      ```

      ```console
      kubectl apply -f provider.yaml
      kubectl get providers.pkg.crossplane.io provider-openfga   # wait for HEALTHY=True
      ```

      The provider pods must be able to reach the OpenFGA HTTP API (port 8080 by
      default).

      ## Configure

      ### 1. Store the credentials in a Secret

      The Secret holds a JSON document. `api_url` is the only required key; the rest
      depends on how the OpenFGA server authenticates clients. Unknown keys are
      rejected rather than ignored.

      | Key | Description |
      |---|---|
      | `api_url` | OpenFGA API URL (required), e.g. `https://openfga.example.org` |
      | `api_token` | Pre-shared key, or any access token obtained out of band |
      | `client_id`, `client_secret`, `api_token_issuer` | OIDC client credentials; the provider obtains an access token itself. All three are needed |
      | `api_audience`, `api_scopes` | Refine that token request |
      | `ca_cert` | PEM certificate authority to trust in addition to the system ones |

      `api_token` and the OIDC client credentials are mutually exclusive. A server
      that needs no authentication needs nothing but `api_url`.

      ```console
      kubectl -n crossplane-system create secret generic openfga-creds \
        --from-literal=credentials='{"api_url":"https://openfga.example.org","api_token":"'"${FGA_API_TOKEN}"'"}'
      ```

      ### 2. Create a ClusterProviderConfig

      ```yaml
      apiVersion: openfga.m.crossplane.io/v1beta1
      kind: ClusterProviderConfig
      metadata:
        name: default
      spec:
        credentials:
          source: Secret
          secretRef:
            namespace: crossplane-system
            name: openfga-creds
            key: credentials
      ```

      Namespaced managed resources use the `ClusterProviderConfig` named `default`
      unless they set `providerConfigRef`. A namespaced `ProviderConfig` is also
      available.

      ## Example

      ```yaml
      apiVersion: store.openfga.m.crossplane.io/v1alpha1
      kind: Store
      metadata:
        name: phorge
        namespace: default
      spec:
        forProvider:
          name: phorge
      ---
      apiVersion: model.openfga.m.crossplane.io/v1alpha1
      kind: AuthorizationModel
      metadata:
        name: phorge
        namespace: default
      spec:
        forProvider:
          storeIdRef:
            name: phorge
          modelDsl: |
            model
              schema 1.1

            type user

            type project
              relations
                define admin: [user]
                define viewer: [user] or admin
      ---
      apiVersion: tuple.openfga.m.crossplane.io/v1alpha1
      kind: RelationshipTuple
      metadata:
        name: leo-admin-minecraft
        namespace: default
      spec:
        forProvider:
          storeIdRef:
            name: phorge
          user: user:leo@example.org
          relation: admin
          object: project:minecraft
      ```

      ```console
      kubectl get stores.store.openfga.m.crossplane.io phorge   # SYNCED/READY=True
      ```

      ## Resources

      | Group | Kinds |
      |---|---|
      | `store` | Store |
      | `model` | AuthorizationModel |
      | `tuple` | RelationshipTuple |

      Each is available namespaced (`*.openfga.m.crossplane.io`) and cluster-scoped
      (`*.openfga.crossplane.io`).

      > **`AuthorizationModel` does not work with terraform-provider-openfga 0.5.1.**
      > Upstream's `openfga_authorization_model` reports an error, rather than
      > reporting the model as absent, when it is refreshed before it exists, which
      > is how Crossplane observes a resource before creating it. `Store` and
      > `RelationshipTuple` are unaffected. See the repository README; the fix is a
      > three-line upstream change and needs only a version bump here.

      Good to know:

      - A `Store` takes its OpenFGA name from `spec.forProvider.name`, not from
        `metadata.name`: OpenFGA identifies a store by a ULID it assigns, which
        becomes the external name. The same goes for an `AuthorizationModel`.
      - **Every field of every resource is immutable.** OpenFGA has no update
        operation for any of them, so changing one deletes and recreates it. A
        `Store` is the dangerous case, since that would take its models and tuples
        with it, so a `Store` whose name changed is reported as an error instead.
      - An `AuthorizationModel` is versioned and append-only: changing it writes a
        new version and leaves the previous one in place, and deleting the resource
        does not remove it from the store either, because OpenFGA cannot delete
        authorization models.
      - `AuthorizationModel` accepts the model as OpenFGA DSL in `modelDsl` or as
        JSON in `modelJson`, exactly one of the two. `modelDsl` is the readable
        option; both are normalized to the same canonical JSON.
      - A `RelationshipTuple` has no identifier of its own and is addressed by
        `<store_id>[/<model_id>]/<user>/<relation>/<object>`. Its
        `authorizationModelId` is optional: without it the tuple is validated
        against the store's latest model.

      See the [README](https://github.com/l-nmch/provider-openfga#readme) for details.


apiVersion: model.openfga.crossplane.io/v1alpha1
kind: AuthorizationModel
metadata:
  annotations:
    meta.upbound.io/example-id: model/v1alpha1/authorizationmodel
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    modelJson: ${data.openfga_authorization_model_document.example.result}
    storeIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: store.openfga.crossplane.io/v1alpha1
kind: Store
metadata:
  annotations:
    meta.upbound.io/example-id: model/v1alpha1/authorizationmodel
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    name: example_store_name

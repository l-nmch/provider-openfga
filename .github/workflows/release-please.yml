name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-26.04
    steps:
      # A token other than GITHUB_TOKEN, so that the release pull request runs the checks and the tag
      # it creates starts the publish workflow (events created with GITHUB_TOKEN trigger nothing).
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: '${{ secrets.RENOVATE_TOKEN }}'
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

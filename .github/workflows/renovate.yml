name: Renovate

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  renovate:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        env:
          RENOVATE_REPOSITORIES: '["l-nmch/provider-openfga"]'
        with:
          configurationFile: .github/renovate.json5
          token: '${{ secrets.RENOVATE_TOKEN }}'
